{{- range $color, $version := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-{{ $color }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels: {app: web, color: {{ $color }}}
  template:
    metadata:
      labels: {app: web, color: {{ $color }}}
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '<h1>KT-6</h1><p>%s | %s | %s</p>\n' \
                '{{ $.Values.environment }}' '{{ $color }}' \
                '{{ $version }}' > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
{{ toYaml $.Values.resources | indent 12 }}
{{- end }}
